# Application config. Secrets never live here; they come from .env.

paypal:
  http:
    timeout_seconds: 30
    max_retries: 3            # retries on 5xx and transport errors only
    backoff_base_seconds: 0.5 # exponential: base * 2**attempt
    backoff_max_seconds: 8
  oauth:
    token_refresh_margin_seconds: 120  # refresh this long before expires_in
  authorization:
    honor_period_days: 3
    valid_days: 29
  custom_id:
    prefix: "pv:"
    hash_hex_chars: 32
    max_length: 127

recorder:
  hash_algorithm: sha256

remedy:
  auto_remedy_env: AUTO_REMEDY

attribution:
  samples_per_coalition: 4        # development and evaluation
  demo_samples_per_coalition: 8   # the single recorded demo case
  posterior_draws: 4000          # Jeffreys posterior draws pushed through the Shapley map
  ci_level: 0.95
  max_ci_width_for_auto: 0.35
  # Share sample j's plan between coalitions whose planner input is identical (do(S), do(S+M)),
  # Halves planner calls; see blackbox/replay. Set false to sample every coalition
  # independently. Decided 2026-10-06 to fit the reference model's daily budget.
  common_random_numbers: true

webhooks:
  # Event types each REST app subscribes to (brief section 5.3).
  event_types:
    merchant:
      - CHECKOUT.ORDER.APPROVED
      - PAYMENT.AUTHORIZATION.CREATED
      - PAYMENT.AUTHORIZATION.VOIDED
      - PAYMENT.CAPTURE.COMPLETED
      - PAYMENT.CAPTURE.REFUNDED
      - CUSTOMER.DISPUTE.CREATED
      - CUSTOMER.DISPUTE.UPDATED
      - CUSTOMER.DISPUTE.RESOLVED
    operator:
      - PAYMENT.PAYOUTSBATCH.SUCCESS
      - PAYMENT.PAYOUTSBATCH.DENIED
  path_prefix: /webhooks/paypal

purchase:
  mandate_ttl_minutes: 60
  planner_prompt: planner_v2
  planner_max_repairs: 1
  q_llm_seed: 7                 # fixed seed so extraction and ranking replay identically
  approval_poll_seconds: 5
  approval_timeout_seconds: 900

web:
  # Buyer app (web/, Next.js) talking to the API (api/app.py).
  api_port: 8700
  cors_origins: ["http://localhost:3000", "http://127.0.0.1:3000"]
  sdk_script_url: "https://www.sandbox.paypal.com/web-sdk/v6/core"
  presentation_mode: "auto"
  # Domains the browser client token is bound to. PayPal rejects localhost and IPs
  # (invalid_domain, seen in S8), so this stays empty locally; set the public domain on deploy.
  client_token_domains: []
  approval_poll_seconds: 2
  approval_timeout_seconds: 60
  max_photo_bytes: 4000000
  reconcile_interval_seconds: 10  # the API's background poller (webhooks only make it poll sooner)
