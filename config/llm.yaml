# LLM layer configuration. Keys and model ids come from .env; this file holds endpoints,
# per-model budgets and call policy. Budget numbers come from spike S9 and provider headers.

providers:
  groq:
    kind: openai_compatible
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  gemini:
    kind: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY

roles: [planner, mandate, extractor, vision, vision_escalation, narrator, reference_policy, baseline, seed_generator]

http:
  timeout_seconds: 120
  max_retries: 2            # on 5xx and transport errors, before falling back
  backoff_base_seconds: 1.0
  default_cooldown_seconds: 60   # after a 429 without a retry hint
  # Wait this long for a full per-minute window (tokens or requests) before falling back. A
  # request-count window (Flash-Lite: 15 per minute) can need up to 60 s to free a slot.
  max_wait_seconds: 65

# Per-model limits. tokens_per_minute and requests_per_day are read from Groq's
# x-ratelimit-* headers (2026-10-05). tokens_per_day is our own cap, set below the provider's
# so a demo day can never be stopped by a hard provider limit.
budgets:
  default:
    tokens_per_minute: 8000
    requests_per_day: 1000
    tokens_per_day: 150000
  models:
    "openai/gpt-oss-120b": {tokens_per_minute: 8000, requests_per_day: 1000, tokens_per_day: 150000}
    "openai/gpt-oss-20b": {tokens_per_minute: 8000, requests_per_day: 1000, tokens_per_day: 150000}
    "qwen/qwen3.8-27b": {tokens_per_minute: 8000, requests_per_day: 1000, tokens_per_day: 150000}
    # Gemini free tier, from AI Studio's rate-limit page (2026-10-06): 3.8 Flash 5 RPM, 250K TPM,
    # 20 RPD (also seen in a 429 QuotaFailure on 2026-10-05); 3.5 Flash-Lite 15 RPM, 250K TPM,
    # 500 RPD. Daily quotas reset at midnight Pacific. tokens_per_day is our own cap.
    "gemini-3.8-flash": {tokens_per_minute: 250000, requests_per_minute: 5, requests_per_day: 20, tokens_per_day: 500000, day_reset_tz: "America/Los_Angeles"}
    "gemini-3.5-flash-lite": {tokens_per_minute: 250000, requests_per_minute: 15, requests_per_day: 500, tokens_per_day: 2000000, day_reset_tz: "America/Los_Angeles"}

# Replay cache (Blackbox): which roles may reuse a recorded response when inputs are identical.
#   always: reuse whenever the exact inputs were seen (deterministic roles, temperature 0)
#   never:  always call the model (the sampled planner during counterfactual replay)
# Warn when a model reaches this share of its daily requests or tokens.
budget_warning_fraction: "0.8"

# Per-role call defaults. max_tokens sized from S9 (largest v2 plan: 704 output tokens).
calls:
  planner: {max_tokens: 1200, temperature: "0.7", structured: json}
  reference_policy: {max_tokens: 1200, temperature: "0.7", structured: schema}
  mandate: {max_tokens: 1200, temperature: "0", structured: schema}
  extractor: {max_tokens: 1024, temperature: "0", structured: strict}
  vision: {max_tokens: 512, temperature: "0", structured: schema}
  vision_escalation: {max_tokens: 1024, temperature: "0", structured: schema}
  narrator: {max_tokens: 800, temperature: "0.3", structured: schema}
  # The baseline agent samples like the planner (same model, same temperature): the comparison
  # isolates architecture, not decoding settings.
  baseline: {max_tokens: 900, temperature: "0.7", structured: json}

cache:
  extractor: always
  vision: always
  vision_escalation: always
  mandate: always
  narrator: never
  planner: never
  reference_policy: never
  baseline: never
  seed_generator: never
