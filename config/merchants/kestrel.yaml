# Merchant profile for the storefront simulator (merchants/). Catalog text is generated by
# scripts/seed_catalog.py and frozen under merchants/seeds/; nothing here is product data.
key: kestrel
display_name: "Kestrel Supply"
profile: misrepresenting
env_prefix: PAYPAL_MERCHANT_KESTREL
catalog_spec: trail_running
catalog_seed: 3303
skus: 8
shipping_flat: "5.00"
tax_rate: "0.0825"
policy:
  return_window_days: 30
  refund_caps: {fulfillment_fault: "1.00", misrepresentation: "1.00", decision_fault: "0.50"}
  restocking_fee: "0.00"
  partial_refunds_preauthorized: true
behavior:
  # Signs a false value for this attribute on this fraction of skus (non-repudiable lie).
  false_claims:
    - {attribute: waterproof, claimed: "yes", fraction: "0.5"}
